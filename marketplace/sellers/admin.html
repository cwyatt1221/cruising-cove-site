<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace seller applications admin | Cruising Cove</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/agents.css">
<style>
  .seller-admin-photos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px;}
  .seller-admin-photos img{
    width:88px;height:88px;object-fit:cover;border-radius:2px;
    border:1px solid rgba(26,42,74,.12);background:var(--cream-2);
  }
  .seller-admin-edit{
    margin-top:14px;padding-top:14px;border-top:1px solid rgba(26,42,74,.1);
    display:flex;flex-direction:column;gap:10px;
  }
  .seller-admin-edit label{display:flex;flex-direction:column;gap:4px;font-size:0.82rem;font-weight:600;color:var(--navy);}
  .seller-admin-edit textarea,
  .seller-admin-edit input[type="text"]{
    font:inherit;font-weight:400;padding:8px 10px;border:1px solid rgba(26,42,74,.18);
    border-radius:2px;background:#fff;color:var(--navy);
  }
  .seller-admin-cats{display:flex;flex-wrap:wrap;gap:8px 12px;font-weight:400;}
  .seller-admin-cats label{flex-direction:row;align-items:center;gap:6px;font-weight:500;}
  .seller-admin-cats input{width:auto;margin:0;}
  .seller-admin-hint{font-size:0.78rem;font-weight:400;color:var(--muted);margin:0;}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav class="site-nav-bar" aria-label="Primary">
      <a class="logo" href="/">Cruising Cove</a>
      <div class="nav-cta">
        <a href="/admin/" class="btn btn-outline">Admin home</a>
        <a href="/marketplace/" class="btn btn-outline">Marketplace</a>
      </div>
    </nav>
  </div>
</header>

<main class="agent-admin-shell">
  <div class="wrap" style="max-width:960px;">
    <section class="agent-admin-panel">
      <h1>Marketplace seller applications</h1>
      <p class="agent-admin-sub">Sign in with your admin password, then review Curated 10 submissions and publish approved shops (max 10 live). Edit category tags and social-proof quotes on live shops.</p>
      <div class="agent-admin-key">
        <label for="adminPassword">Admin password</label>
        <input id="adminPassword" type="password" autocomplete="current-password">
      </div>
      <div class="agent-admin-actions">
        <button type="button" class="btn btn-gold" id="adminLoginBtn">Sign in</button>
        <button type="button" class="btn btn-outline" id="adminLogoutBtn" hidden>Sign out</button>
        <button type="button" class="btn btn-gold" id="loadPending">Pending</button>
        <button type="button" class="btn btn-outline" id="loadApproved">Approved</button>
        <button type="button" class="btn btn-outline" id="loadAll">All</button>
        <button type="button" class="btn btn-outline" id="loadLive">Live marketplace</button>
      </div>
      <p class="agent-admin-status" id="adminStatus" hidden></p>
      <div id="adminList" class="agent-admin-list"></div>
    </section>
  </div>
</main>

<script src="/assets/admin-auth.js"></script>
<script>
(function () {
  var CATEGORIES = [
    "Door magnets",
    "Fish extender gifts",
    "Cabin décor",
    "Personalized keepsakes",
    "Celebration / birthday",
    "Packing organizers",
    "Lanyards & credentials",
    "Luggage tags",
    "Apparel",
    "Printables"
  ];

  var list = document.getElementById("adminList");
  var statusEl = document.getElementById("adminStatus");

  function key() {
    return (window.CCAdminAuth && window.CCAdminAuth.getToken()) || "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showStatus(msg, ok) {
    statusEl.hidden = false;
    statusEl.textContent = msg;
    statusEl.className = "agent-admin-status " + (ok ? "ok" : "err");
  }

  function slugPreview(name) {
    return String(name || "shop")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "shop";
  }

  function photosHtml(urls) {
    var list = urls || [];
    if (!list.length) return "";
    return (
      '<div class="seller-admin-photos">' +
      list.slice(0, 4).map(function (u) {
        return '<img src="' + escapeHtml(u) + '" alt="">';
      }).join("") +
      "</div>"
    );
  }

  function categoryChecks(selected) {
    var selectedSet = {};
    var extras = [];
    (selected || []).forEach(function (c) {
      var name = String(c || "").trim();
      if (!name || selectedSet[name]) return;
      selectedSet[name] = true;
      if (CATEGORIES.indexOf(name) === -1) extras.push(name);
    });
    var all = CATEGORIES.concat(extras);
    return (
      '<div class="seller-admin-cats" data-categories>' +
      all.map(function (cat) {
        return (
          '<label><input type="checkbox" value="' + escapeHtml(cat) + '"' +
          (selectedSet[cat] ? " checked" : "") +
          "> " + escapeHtml(cat) + "</label>"
        );
      }).join("") +
      "</div>"
    );
  }

  function firstQuote(quotes) {
    if (!quotes || !quotes.length) return { quote: "", name: "" };
    return {
      quote: quotes[0].quote || "",
      name: quotes[0].name || ""
    };
  }

  function readEditFields(card) {
    var cats = Array.from(card.querySelectorAll("[data-categories] input:checked")).map(function (el) {
      return el.value;
    });
    var quoteEl = card.querySelector("[data-quote]");
    var nameEl = card.querySelector("[data-quote-name]");
    var quote = quoteEl ? quoteEl.value.trim() : "";
    var name = nameEl ? nameEl.value.trim() : "";
    var socialProofQuotes = quote ? [{ quote: quote, name: name || undefined }] : [];
    return { categories: cats, socialProofQuotes: socialProofQuotes };
  }

  function renderApps(rows, title) {
    if (!rows.length) {
      list.innerHTML = "<p class='agent-admin-empty'>No applications.</p>";
      return;
    }
    list.innerHTML =
      "<h2>" + escapeHtml(title) + " <span>(" + rows.length + ")</span></h2>" +
      rows.map(function (a) {
        var pending = a.status === "pending";
        var approved = a.status === "approved";
        var live = a.publishedSellerId
          ? "/marketplace/#" + encodeURIComponent(a.publishedSellerId)
          : "";
        var cats = a.categories && a.categories.length ? a.categories : (a.productCategories || []);
        var q = firstQuote(a.socialProofQuotes);
        return (
          '<article class="agent-admin-card" data-id="' + escapeHtml(a.id) + '" data-pk="' + escapeHtml(a.partitionKey) + '">' +
            '<div class="agent-admin-card-top">' +
              (a.photoUrls && a.photoUrls[0]
                ? '<img class="agent-admin-photo" src="' + escapeHtml(a.photoUrls[0]) + '" alt="">'
                : '<div class="agent-avatar" aria-hidden="true">?</div>') +
              '<div>' +
                "<h3>" + escapeHtml(a.shopName) +
                ' <span class="agent-badge">' + escapeHtml(a.status || "pending") + "</span></h3>" +
                '<p class="agent-meta">' + escapeHtml(a.ownerName) + " · " + escapeHtml(a.email) + "</p>" +
                '<p class="agent-meta"><a href="' + escapeHtml(a.shopUrl || a.etsyShopUrl || "") + '" target="_blank" rel="noopener noreferrer">' +
                escapeHtml(a.shopUrl || a.etsyShopUrl || "") + "</a></p>" +
                '<p class="agent-meta">Submitted ' + escapeHtml(a.submittedAt || "") + "</p>" +
              "</div>" +
            "</div>" +
            photosHtml(a.photoUrls) +
            "<p>" + escapeHtml(a.shopDescription) + "</p>" +
            '<div class="agent-tags">' +
              cats.map(function (s) {
                return '<span class="agent-tag">' + escapeHtml(s) + "</span>";
              }).join("") +
              (a.productCategoriesOther
                ? '<span class="agent-tag">' + escapeHtml(a.productCategoriesOther) + "</span>"
                : "") +
            "</div>" +
            '<p class="agent-meta">Audience: ' + escapeHtml(a.audienceSize || "—") +
              " · Barter: " + escapeHtml(a.willingToBarter || "—") +
            "</p>" +
            (a.socialLinks && (a.socialLinks.instagram || a.socialLinks.tiktok || a.socialLinks.facebook)
              ? '<p class="agent-meta">Social: ' +
                [a.socialLinks.instagram, a.socialLinks.tiktok, a.socialLinks.facebook]
                  .filter(Boolean)
                  .map(function (u) {
                    return '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(u) + "</a>";
                  }).join(" · ") +
                "</p>"
              : "") +
            (a.otherNotes
              ? "<p class='agent-meta'>Notes: " + escapeHtml(a.otherNotes) + "</p>"
              : "") +
            (live
              ? '<p class="agent-meta"><a href="' + escapeHtml(live) + '">View on marketplace →</a></p>'
              : "") +
            (pending || approved
              ? '<div class="agent-admin-card-actions">' +
                  '<label class="agent-admin-check"><input type="checkbox" data-featured ' +
                    (a.featured ? "checked" : "") +
                    "> Featured on marketplace</label>" +
                  '<label class="agent-admin-slug">Shop URL id' +
                  '<input type="text" data-seller-id value="' +
                  escapeHtml(a.publishedSellerId || slugPreview(a.shopName)) +
                  '" ' + (a.publishedSellerId ? "readonly" : "") + ">" +
                  "</label>" +
                  '<div class="seller-admin-edit">' +
                    '<p class="seller-admin-hint">Category tags (shown on marketplace + filter chips)</p>' +
                    categoryChecks(cats) +
                    '<label>Social proof quote (optional)<textarea data-quote rows="2" placeholder="Short guest quote">' +
                    escapeHtml(q.quote) +
                    "</textarea></label>" +
                    '<label>Reviewer first name (optional)<input type="text" data-quote-name value="' +
                    escapeHtml(q.name) +
                    '" placeholder="e.g. Sarah"></label>' +
                  "</div>" +
                  '<button type="button" class="btn btn-gold" data-action="approve">' +
                  (approved ? "Update / re-publish" : "Publish to marketplace") +
                  "</button>" +
                  (pending
                    ? '<button type="button" class="btn btn-outline" data-action="reject">Reject</button>'
                    : "") +
                  (approved
                    ? '<button type="button" class="btn btn-outline" data-action="unpublish">Unpublish</button>'
                    : "") +
                "</div>"
              : "") +
          "</article>"
        );
      }).join("");
  }

  async function loadApps(status) {
    if (!key()) {
      list.innerHTML = "<p class='agent-admin-empty'>Sign in with your admin password.</p>";
      return;
    }
    list.innerHTML = "<p class='agent-admin-empty'>Loading…</p>";
    statusEl.hidden = true;
    try {
      var url = "/api/seller-applications?key=" + encodeURIComponent(key());
      if (status) url += "&status=" + encodeURIComponent(status);
      var res = await fetch(url);
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load");
      var title = status ? status.charAt(0).toUpperCase() + status.slice(1) : "All applications";
      renderApps(data.applications || [], title);
    } catch (err) {
      list.innerHTML = "<p class='agent-admin-empty'>" + escapeHtml(err.message) + "</p>";
    }
  }

  async function loadLive() {
    list.innerHTML = "<p class='agent-admin-empty'>Loading live marketplace…</p>";
    statusEl.hidden = true;
    try {
      var res = await fetch("/api/sellers");
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      var sellers = data.sellers || [];
      if (!sellers.length) {
        list.innerHTML = "<p class='agent-admin-empty'>No live shops published yet.</p>";
        return;
      }
      list.innerHTML =
        "<h2>Live marketplace <span>(" + sellers.length + " of " + (data.max || 10) + ")</span></h2>" +
        sellers.map(function (s) {
          var q = firstQuote(s.socialProofQuotes);
          return (
            '<article class="agent-admin-card" data-seller-live-id="' + escapeHtml(s.id) + '">' +
              '<div class="agent-admin-card-top">' +
                (s.photoUrls && s.photoUrls[0]
                  ? '<img class="agent-admin-photo" src="' + escapeHtml(s.photoUrls[0]) + '" alt="">'
                  : '<div class="agent-avatar" aria-hidden="true">?</div>') +
                "<div><h3>" + escapeHtml(s.name) +
                (s.featured ? ' <span class="agent-badge teal">Featured</span>' : "") +
                "</h3>" +
                '<p class="agent-meta"><a href="' + escapeHtml(s.shopUrl || s.etsyUrl || "") + '" target="_blank" rel="noopener noreferrer">' +
                escapeHtml(s.shopUrl || s.etsyUrl || "") + "</a></p>" +
                '<p class="agent-meta"><a href="/marketplace/#' + encodeURIComponent(s.id) +
                '">/marketplace/#' + escapeHtml(s.id) + "</a></p>" +
                '<p class="agent-meta">Visits: ' + escapeHtml(String(s.visitCount || 0)) + "</p>" +
                "</div></div>" +
              "<p>" + escapeHtml(s.description) + "</p>" +
              '<div class="agent-tags">' +
                (s.categories || []).map(function (c) {
                  return '<span class="agent-tag">' + escapeHtml(c) + "</span>";
                }).join("") +
              "</div>" +
              '<div class="seller-admin-edit">' +
                '<p class="seller-admin-hint">Edit tags &amp; social proof, then save</p>' +
                categoryChecks(s.categories || []) +
                '<label>Social proof quote<textarea data-quote rows="2" placeholder="Short guest quote">' +
                escapeHtml(q.quote) +
                "</textarea></label>" +
                '<label>Reviewer first name<input type="text" data-quote-name value="' +
                escapeHtml(q.name) +
                '" placeholder="e.g. Sarah"></label>' +
                '<button type="button" class="btn btn-gold" data-action="save-live">Save shop card</button>' +
              "</div>" +
            "</article>"
          );
        }).join("");
    } catch (err) {
      list.innerHTML = "<p class='agent-admin-empty'>" + escapeHtml(err.message) + "</p>";
    }
  }

  async function moderate(card, action) {
    var id = card.getAttribute("data-id");
    var pk = card.getAttribute("data-pk");
    var featuredEl = card.querySelector("[data-featured]");
    var idEl = card.querySelector("[data-seller-id]");
    var edits = readEditFields(card);
    var payload = {
      partitionKey: pk,
      action: action,
      featured: featuredEl ? featuredEl.checked : false,
      sellerId: idEl ? idEl.value.trim() : "",
      socialProofQuotes: edits.socialProofQuotes
    };
    // Only override categories when the admin checked at least one (avoids wiping legacy tags)
    if (edits.categories.length) payload.categories = edits.categories;
    var res = await fetch(
      "/api/seller-applications/" + encodeURIComponent(id) + "?key=" + encodeURIComponent(key()),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }
    );
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || "Update failed");
    return data;
  }

  async function saveLive(card) {
    var id = card.getAttribute("data-seller-live-id");
    if (!id) throw new Error("Missing seller id");
    var edits = readEditFields(card);
    var res = await fetch(
      "/api/sellers/" + encodeURIComponent(id) + "?key=" + encodeURIComponent(key()),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(edits)
      }
    );
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || "Save failed");
    return data;
  }

  document.getElementById("loadPending").addEventListener("click", function () { loadApps("pending"); });
  document.getElementById("loadApproved").addEventListener("click", function () { loadApps("approved"); });
  document.getElementById("loadAll").addEventListener("click", function () { loadApps(""); });
  document.getElementById("loadLive").addEventListener("click", loadLive);

  list.addEventListener("click", async function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var card = btn.closest(".agent-admin-card");
    if (!card) return;
    var action = btn.getAttribute("data-action");
    btn.disabled = true;
    try {
      if (action === "save-live") {
        await saveLive(card);
        showStatus("Live shop card updated.", true);
        loadLive();
        return;
      }
      var data = await moderate(card, action);
      if (action === "approve") {
        showStatus("Published — live on the marketplace" + (data.marketplacePath ? " (" + data.marketplacePath + ")" : ""), true);
      } else if (action === "reject") {
        showStatus("Application rejected.", true);
      } else if (action === "unpublish") {
        showStatus("Removed from the public marketplace.", true);
      } else {
        showStatus("Updated.", true);
      }
      loadApps(action === "approve" ? "approved" : "pending");
    } catch (err) {
      showStatus(err.message || "Something went wrong.", false);
      btn.disabled = false;
    }
  });

  window.CCAdminAuth.bind({
    passwordInput: document.getElementById("adminPassword"),
    loginBtn: document.getElementById("adminLoginBtn"),
    logoutBtn: document.getElementById("adminLogoutBtn"),
    statusEl: statusEl,
    onReady: function () { loadApps("pending"); }
  });
})();
</script>
</body>
</html>
