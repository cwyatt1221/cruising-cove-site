<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decoration photos admin | Cruising Cove</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/agents.css">
<style>
  .deco-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px;}
  @media (max-width:700px){.deco-admin-grid{grid-template-columns:1fr;}}
  .deco-admin-card{
    background:var(--cream);border:1px solid rgba(26,42,74,.1);padding:14px;
  }
  .deco-admin-card img{width:100%;max-height:280px;object-fit:cover;display:block;margin-bottom:10px;background:var(--cream-2);}
  .deco-admin-card .meta{font-size:0.88rem;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .deco-admin-card .actions{display:flex;flex-wrap:wrap;gap:8px;}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav class="site-nav-bar" aria-label="Primary">
      <a class="logo" href="/">Cruising Cove</a>
      <div class="nav-cta">
        <a href="/decorations/" class="btn btn-outline">Decorations page</a>
      </div>
    </nav>
  </div>
</header>

<main class="agent-admin-shell">
  <div class="wrap" style="max-width:960px;">
    <section class="agent-admin-panel">
      <h1>Decoration photo moderation</h1>
      <p class="agent-admin-sub">Sign in with your admin password, then approve guest door and Fish Extender photos before they appear in the public gallery.</p>
      <div class="agent-admin-key">
        <label for="adminPassword">Admin password</label>
        <input id="adminPassword" type="password" autocomplete="current-password">
      </div>
      <div class="agent-admin-actions">
        <button type="button" class="btn btn-gold" id="adminLoginBtn">Sign in</button>
        <button type="button" class="btn btn-outline" id="adminLogoutBtn" hidden>Sign out</button>
        <button type="button" class="btn btn-gold" id="loadPending">Pending</button>
        <button type="button" class="btn btn-outline" id="loadApproved">Approved</button>
        <button type="button" class="btn btn-outline" id="loadRejected">Rejected</button>
      </div>
      <p class="agent-admin-status" id="adminStatus" hidden></p>
      <div id="adminList" class="deco-admin-grid"></div>
    </section>
  </div>
</main>

<script src="/assets/admin-auth.js"></script>
<script>
(function () {
  var list = document.getElementById("adminList");
  var statusEl = document.getElementById("adminStatus");

  function key() {
    return (window.CCAdminAuth && window.CCAdminAuth.getToken()) || "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showStatus(msg, ok) {
    statusEl.hidden = false;
    statusEl.textContent = msg;
    statusEl.className = "agent-admin-status " + (ok ? "ok" : "err");
  }

  function categoryLabel(c) {
    if (c === "door") return "Door magnets";
    if (c === "fish-extender") return "Fish Extender";
    return "Other";
  }

  async function load(status) {
    if (!key()) {
      list.innerHTML = "<p class='agent-admin-empty'>Sign in with your admin password.</p>";
      return;
    }
    list.innerHTML = "<p class='agent-admin-empty'>Loading…</p>";
    try {
      var res = await fetch(
        "/api/agent-photo-upload?scope=decorations&status=" +
          encodeURIComponent(status) +
          "&key=" +
          encodeURIComponent(key())
      );
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Failed to load");
      var photos = data.photos || [];
      if (!photos.length) {
        list.innerHTML = "<p class='agent-admin-empty'>No " + escapeHtml(status) + " photos.</p>";
        return;
      }
      list.innerHTML = photos
        .map(function (p) {
          return (
            '<article class="deco-admin-card" data-id="' +
            escapeHtml(p.id) +
            '">' +
            '<img src="' +
            escapeHtml(p.photoUrl) +
            '" alt="">' +
            '<p class="meta"><strong>' +
            escapeHtml(categoryLabel(p.category)) +
            (p.ship ? " · " + escapeHtml(p.ship) : "") +
            "</strong><br>" +
            escapeHtml(p.caption || "No caption") +
            "<br>" +
            escapeHtml(p.displayName || "Guest") +
            (p.userEmail ? " · " + escapeHtml(p.userEmail) : "") +
            "<br>" +
            escapeHtml(p.createdAt || "") +
            "</p>" +
            (p.status === "pending"
              ? '<div class="actions">' +
                '<button type="button" class="btn btn-gold" data-action="approve">Approve</button>' +
                '<button type="button" class="btn btn-outline" data-action="reject">Reject</button>' +
                "</div>"
              : '<p class="meta">Status: ' + escapeHtml(p.status) + "</p>") +
            "</article>"
          );
        })
        .join("");
    } catch (err) {
      list.innerHTML = "<p class='agent-admin-empty'>" + escapeHtml(err.message || "Failed") + "</p>";
    }
  }

  document.getElementById("loadPending").onclick = function () { load("pending"); };
  document.getElementById("loadApproved").onclick = function () { load("approved"); };
  document.getElementById("loadRejected").onclick = function () { load("rejected"); };

  list.addEventListener("click", async function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn || !key()) return;
    var card = btn.closest(".deco-admin-card");
    if (!card) return;
    var action = btn.getAttribute("data-action");
    btn.disabled = true;
    try {
      var res = await fetch("/api/agent-photo-upload?scope=decorations&key=" + encodeURIComponent(key()), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          scope: "decorations",
          action: action,
          id: card.getAttribute("data-id"),
        }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Update failed");
      showStatus(action === "approve" ? "Approved — live in the gallery." : "Rejected.", true);
      load("pending");
    } catch (err) {
      showStatus(err.message || "Failed", false);
      btn.disabled = false;
    }
  });

  window.CCAdminAuth.bind({
    passwordInput: document.getElementById("adminPassword"),
    loginBtn: document.getElementById("adminLoginBtn"),
    logoutBtn: document.getElementById("adminLogoutBtn"),
    statusEl: statusEl,
    onReady: function () { load("pending"); },
  });
})();
</script>
</body>
</html>
