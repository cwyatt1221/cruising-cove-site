<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cruise admin | Cruising Cove</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/my-cruise.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav class="site-nav-bar" aria-label="Primary">
      <a class="logo" href="/">Cruising Cove</a>
      <div class="nav-cta">
        <a href="/admin/" class="btn btn-outline">Admin home</a>
        <a href="/planning/my-cruise.html" class="btn btn-outline">Back to My Cruise</a>
      </div>
    </nav>
  </div>
</header>

<main class="mc-shell">
  <div class="wrap" style="max-width:900px;">
    <section class="mc-panel">
      <h2>My Cruise moderation</h2>
      <p class="mc-sub">Sign in with your admin password, then approve packing suggestions and reviews before they go public.</p>
      <div class="mc-field">
        <label for="adminPassword">Admin password</label>
        <input id="adminPassword" type="password" autocomplete="current-password">
      </div>
      <div class="mc-actions">
        <button type="button" class="btn btn-gold" id="adminLoginBtn">Sign in</button>
        <button type="button" class="btn btn-outline" id="adminLogoutBtn" hidden>Sign out</button>
        <button type="button" class="btn btn-gold" id="loadPacking">Pending packing</button>
        <button type="button" class="btn btn-outline" id="loadReviews">Pending reviews</button>
        <button type="button" class="btn btn-outline" id="loadAllPacking">All packing</button>
        <button type="button" class="btn btn-outline" id="loadAllReviews">All reviews</button>
      </div>
      <p class="mc-empty" id="adminStatus" hidden style="margin-top:10px;"></p>
      <div id="adminList" style="margin-top:18px;"></div>
    </section>
  </div>
</main>

<script src="/assets/admin-auth.js"></script>
<script>
(function () {
  var list = document.getElementById("adminList");

  function key() {
    return (window.CCAdminAuth && window.CCAdminAuth.getToken()) || "";
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function loadPacking(status) {
    if (!key()) {
      list.innerHTML = "<p class='mc-empty'>Sign in with your admin password.</p>";
      return;
    }
    list.innerHTML = "<p class='mc-empty'>Loading…</p>";
    try {
      var res = await fetch(
        "/api/planner/admin/packing-suggestions?key=" +
          encodeURIComponent(key()) +
          "&status=" +
          encodeURIComponent(status)
      );
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      var rows = data.suggestions || [];
      if (!rows.length) {
        list.innerHTML = "<p class='mc-empty'>No packing suggestions.</p>";
        return;
      }
      list.innerHTML =
        "<h3 class='mc-h3'>Packing suggestions</h3>" +
        rows
          .map(function (s) {
            return (
              '<article class="mc-exc" style="margin-bottom:12px;">' +
              "<h3>" +
              escapeHtml(s.item) +
              " <span class='tag'>" +
              escapeHtml(s.status) +
              "</span></h3>" +
              "<p>" +
              escapeHtml(s.reason || "No reason given") +
              "</p>" +
              "<p class='meta'>From " +
              escapeHtml(s.displayName) +
              " · " +
              escapeHtml(s.createdAt) +
              "</p>" +
              (s.status === "pending"
                ? '<div class="mc-exc-actions">' +
                  '<button type="button" class="btn btn-gold" data-approve-pack="' +
                  escapeHtml(s.id) +
                  '">Approve</button>' +
                  '<button type="button" class="btn btn-outline" data-reject-pack="' +
                  escapeHtml(s.id) +
                  '">Reject</button></div>'
                : "") +
              "</article>"
            );
          })
          .join("");
    } catch (err) {
      list.innerHTML = "<p class='mc-empty'>" + escapeHtml(err.message) + "</p>";
    }
  }

  async function loadReviews(status) {
    if (!key()) {
      list.innerHTML = "<p class='mc-empty'>Sign in with your admin password.</p>";
      return;
    }
    list.innerHTML = "<p class='mc-empty'>Loading…</p>";
    try {
      var res = await fetch(
        "/api/planner/admin/reviews?key=" +
          encodeURIComponent(key()) +
          "&status=" +
          encodeURIComponent(status)
      );
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      var rows = data.reviews || [];
      if (!rows.length) {
        list.innerHTML = "<p class='mc-empty'>No reviews.</p>";
        return;
      }
      list.innerHTML =
        "<h3 class='mc-h3'>Reviews</h3>" +
        rows
          .map(function (r) {
            return (
              '<article class="mc-exc" style="margin-bottom:12px;">' +
              "<h3>" +
              escapeHtml(r.targetType) +
              ":" +
              escapeHtml(r.targetId) +
              " · " +
              escapeHtml(String(r.rating)) +
              "★ <span class='tag'>" +
              escapeHtml(r.status) +
              "</span></h3>" +
              "<p><strong>" +
              escapeHtml(r.title || "Review") +
              "</strong> — " +
              escapeHtml(r.body) +
              "</p>" +
              "<p class='meta'>From " +
              escapeHtml(r.displayName) +
              " · " +
              escapeHtml(r.createdAt) +
              "</p>" +
              (r.status === "pending"
                ? '<div class="mc-exc-actions">' +
                  '<button type="button" class="btn btn-gold" data-approve-rev="' +
                  escapeHtml(r.id) +
                  '" data-pk="' +
                  escapeHtml(r.partitionKey) +
                  '">Approve</button>' +
                  '<button type="button" class="btn btn-outline" data-reject-rev="' +
                  escapeHtml(r.id) +
                  '" data-pk="' +
                  escapeHtml(r.partitionKey) +
                  '">Reject</button></div>'
                : "") +
              "</article>"
            );
          })
          .join("");
    } catch (err) {
      list.innerHTML = "<p class='mc-empty'>" + escapeHtml(err.message) + "</p>";
    }
  }

  async function moderatePack(id, action) {
    var res = await fetch(
      "/api/planner/admin/packing-suggestions/" +
        encodeURIComponent(id) +
        "?key=" +
        encodeURIComponent(key()),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: action }),
      }
    );
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed");
    await loadPacking("pending");
  }

  async function moderateReview(id, pk, action) {
    var res = await fetch(
      "/api/planner/admin/reviews/" + encodeURIComponent(id) + "?key=" + encodeURIComponent(key()),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: action, partitionKey: pk }),
      }
    );
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed");
    await loadReviews("pending");
  }

  document.getElementById("loadPacking").onclick = function () {
    loadPacking("pending");
  };
  document.getElementById("loadAllPacking").onclick = function () {
    loadPacking("all");
  };
  document.getElementById("loadReviews").onclick = function () {
    loadReviews("pending");
  };
  document.getElementById("loadAllReviews").onclick = function () {
    loadReviews("all");
  };
  list.addEventListener("click", function (e) {
    var ap = e.target.getAttribute("data-approve-pack");
    var rp = e.target.getAttribute("data-reject-pack");
    var ar = e.target.getAttribute("data-approve-rev");
    var rr = e.target.getAttribute("data-reject-rev");
    var pk = e.target.getAttribute("data-pk");
    if (ap) moderatePack(ap, "approve").catch(function (err) {
      alert(err.message);
    });
    if (rp) moderatePack(rp, "reject").catch(function (err) {
      alert(err.message);
    });
    if (ar) moderateReview(ar, pk, "approve").catch(function (err) {
      alert(err.message);
    });
    if (rr) moderateReview(rr, pk, "reject").catch(function (err) {
      alert(err.message);
    });
  });

  window.CCAdminAuth.bind({
    passwordInput: document.getElementById("adminPassword"),
    loginBtn: document.getElementById("adminLoginBtn"),
    logoutBtn: document.getElementById("adminLogoutBtn"),
    statusEl: document.getElementById("adminStatus"),
    onReady: function () { loadPacking("pending"); }
  });
})();
</script>
</body>
</html>
