<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packing suggestions admin | Cruising Cove</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/my-cruise.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav class="site-nav-bar" aria-label="Primary">
      <a class="logo" href="/">Cruising Cove</a>
      <div class="nav-cta">
        <a href="/planning/my-cruise.html" class="btn btn-outline">Back to My Cruise</a>
      </div>
    </nav>
  </div>
</header>

<main class="mc-shell">
  <div class="wrap" style="max-width:820px;">
    <section class="mc-panel">
      <h2>Packing suggestion queue</h2>
      <p class="mc-sub">Uses the same <code>REPORT_ACCESS_KEY</code> as other admin reports. Approved items appear in My Cruise packing lists.</p>
      <div class="mc-field">
        <label for="adminKey">Admin key</label>
        <input id="adminKey" type="password" autocomplete="off">
      </div>
      <div class="mc-actions">
        <button type="button" class="btn btn-gold" id="loadPending">Load pending</button>
        <button type="button" class="btn btn-outline" id="loadAll">Load all</button>
      </div>
      <div id="adminList" style="margin-top:18px;"></div>
    </section>
  </div>
</main>

<script>
(function () {
  var list = document.getElementById("adminList");
  var keyInput = document.getElementById("adminKey");

  function key() {
    return (keyInput.value || "").trim();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function load(status) {
    if (!key()) {
      list.innerHTML = "<p class='mc-empty'>Enter your admin key.</p>";
      return;
    }
    list.innerHTML = "<p class='mc-empty'>Loading…</p>";
    try {
      var res = await fetch(
        "/api/planner/admin/packing-suggestions?key=" +
          encodeURIComponent(key()) +
          "&status=" +
          encodeURIComponent(status)
      );
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      var rows = data.suggestions || [];
      if (!rows.length) {
        list.innerHTML = "<p class='mc-empty'>No suggestions.</p>";
        return;
      }
      list.innerHTML = rows
        .map(function (s) {
          return (
            '<article class="mc-exc" style="margin-bottom:12px;">' +
            "<h3>" +
            escapeHtml(s.item) +
            " <span class='tag'>" +
            escapeHtml(s.status) +
            "</span></h3>" +
            "<p>" +
            escapeHtml(s.reason || "No reason given") +
            "</p>" +
            "<p class='meta'>From " +
            escapeHtml(s.displayName) +
            " · " +
            escapeHtml(s.createdAt) +
            " · tags: " +
            escapeHtml((s.tags || []).join(", ") || "none") +
            "</p>" +
            (s.status === "pending"
              ? '<div class="mc-exc-actions">' +
                '<button type="button" class="btn btn-gold" data-approve="' +
                escapeHtml(s.id) +
                '">Approve</button>' +
                '<button type="button" class="btn btn-outline" data-reject="' +
                escapeHtml(s.id) +
                '">Reject</button></div>'
              : "") +
            "</article>"
          );
        })
        .join("");
    } catch (err) {
      list.innerHTML = "<p class='mc-empty'>" + escapeHtml(err.message) + "</p>";
    }
  }

  async function moderate(id, action) {
    var res = await fetch(
      "/api/planner/admin/packing-suggestions/" +
        encodeURIComponent(id) +
        "?key=" +
        encodeURIComponent(key()),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: action }),
      }
    );
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed");
    await load("pending");
  }

  document.getElementById("loadPending").onclick = function () {
    load("pending");
  };
  document.getElementById("loadAll").onclick = function () {
    load("all");
  };
  list.addEventListener("click", function (e) {
    var a = e.target.getAttribute("data-approve");
    var r = e.target.getAttribute("data-reject");
    if (a) moderate(a, "approve").catch(function (err) {
      alert(err.message);
    });
    if (r) moderate(r, "reject").catch(function (err) {
      alert(err.message);
    });
  });
})();
</script>
</body>
</html>
